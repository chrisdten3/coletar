services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: coletar-postgres
    environment:
      POSTGRES_USER: coletar
      POSTGRES_PASSWORD: coletar
      POSTGRES_DB: coletar
    ports:
      # 5433 on the host so this never collides with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - coletar-pgdata:/var/lib/postgresql/data
      - ./src/coletar/store/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coletar -d coletar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  coletar-pgdata:
