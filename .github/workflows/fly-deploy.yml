# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Manual-only. The Fly trial ended and this workflow has failed on every push to
# main since (#38 through #41), which makes "main is green" meaningless and would
# make branch protection unreadable. Restore the `push` trigger once a host is
# chosen — docs/TODO.md §2.
name: Fly Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
