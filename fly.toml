# fly.toml app configuration file generated for coletar-mcp on 2026-08-27T23:16:07-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'coletar-mcp'
primary_region = 'iad'

[build]
[deploy]
  release_command = 'coletar migrate'

[env]
  COLETAR_EMBEDDING_BACKEND = 'hashing'
  COLETAR_EMBEDDING_DIM = '768'
  COLETAR_MCP_HOST = '0.0.0.0'
  COLETAR_MCP_PORT = '8788'
  COLETAR_STORE_BACKEND = 'postgres'

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
