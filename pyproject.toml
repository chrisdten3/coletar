[project]
name = "coletar"
version = "0.1.0"
description = "Portable AI workspace: memory as a first-class object, with a real provider compiler."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "chrisdten3" }]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "mcp>=2.1",
    # Vector math for the in-process store's index. The zero-infrastructure store
    # has to meet the same retrieval latency budget as the Postgres backend, and a
    # 10,000 x 768 matrix-vector product is ~250ms in interpreter loops versus
    # single-digit milliseconds here. numpy is also pgvector's own companion.
    "numpy>=2.1",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "typer>=0.12",
    "anthropic>=1.3.0",
    # Structured Outputs maps the same Proposal schema onto OpenAI without a
    # provider-specific JSON parser. Provider comparison is a product requirement.
    "openai>=2.0.0",
    # Raw captured episodes must be crypto-shreddable while their event-chain
    # ciphertext and provenance remain append-only.
    "cryptography>=44.0.0",
    # Clerk (and Supabase Auth) hand the browser an RS256 JWT; verifying one means
    # fetching a rotating JWKS, picking the key named by `kid`, and checking a
    # signature. Hand-rolling that is how signature-verification bugs are written --
    # accepting `alg: none`, trusting an unverified header, caching a revoked key
    # forever. PyJWT's PyJWKClient does exactly this and nothing else.
    "pyjwt>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
coletar = "coletar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coletar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `heavy` is deselected by default because the scale tests hold their whole corpus
# in memory at once — ten thousand objects, each with a 768-dimension embedding and
# a detached copy inside the store. That is the right shape for the thing being
# measured and the wrong shape for an 8 GB laptop running Postgres and a model
# server alongside it, where it has caused kernel-level memory pressure rather than
# a clean failure. CI runs the full set with `-m ""`.
addopts = "-q -m 'not heavy'"
markers = [
    "heavy: holds a large corpus in memory; run explicitly or in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["coletar"]
mypy_path = "src"
strict = true
warn_return_any = true
