[project]
name = "coletar"
version = "0.1.0"
description = "Portable AI workspace: memory as a first-class object, with a real provider compiler."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "chrisdten3" }]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "mcp>=2.1",
    # Vector math for the in-process store's index. The zero-infrastructure store
    # has to meet the same retrieval latency budget as the Postgres backend, and a
    # 10,000 x 768 matrix-vector product is ~250ms in interpreter loops versus
    # single-digit milliseconds here. numpy is also pgvector's own companion.
    "numpy>=2.1",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
coletar = "coletar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coletar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["coletar"]
mypy_path = "src"
strict = true
warn_return_any = true
